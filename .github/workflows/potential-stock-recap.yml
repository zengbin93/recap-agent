name: Potential Stock Recap

on:
  schedule:
    # UTC 02:00 = 10:00 Asia/Shanghai, running every Saturday morning.
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      end_date:
        description: "Optional end date in YYYYMMDD; defaults to today"
        required: false
        default: ""
        type: string
      min_pct_change:
        description: "Minimum six-month gain for the replay sample (not the research-pool entry gate)"
        required: true
        default: "100"
        type: string
      min_trading_days:
        description: "Minimum available trading days per stock"
        required: true
        default: "80"
        type: string

permissions:
  contents: write  # 需要写权限来发布 gh-pages

jobs:
  potential-stock-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_WEBHOOKS_JSON: ${{ secrets.FEISHU_WEBHOOKS_JSON }}
      FEISHU_DAILY_WEBHOOK_URL: ${{ secrets.FEISHU_DAILY_WEBHOOK_URL }}
      FEISHU_DAILY_WEBHOOK_SECRET: ${{ secrets.FEISHU_DAILY_WEBHOOK_SECRET }}
      FEISHU_POTENTIAL_WEBHOOK_URL: ${{ secrets.FEISHU_POTENTIAL_WEBHOOK_URL }}
      FEISHU_POTENTIAL_WEBHOOK_SECRET: ${{ secrets.FEISHU_POTENTIAL_WEBHOOK_SECRET }}
      END_DATE: ${{ inputs.end_date }}
      MIN_PCT_CHANGE: ${{ inputs.min_pct_change }}
      MIN_TRADING_DAYS: ${{ inputs.min_trading_days }}
      RECAP_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local package
        run: python -m pip install -e .

      - name: Preflight Tushare token
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "::error::Missing required secret TUSHARE_TOKEN"
            exit 1
          fi
          if [ -z "$FEISHU_WEBHOOK_URL" ] && [ -z "$FEISHU_WEBHOOKS_JSON" ] && [ -z "$FEISHU_POTENTIAL_WEBHOOK_URL" ] && [ -z "$FEISHU_DAILY_WEBHOOK_URL" ]; then
            echo "::warning::No Feishu webhook secret configured; the report will be generated but not sent."
          fi

      - name: Run potential-stock recap chain
        run: |
          args=(--task potential --output-dir artifacts/reports --potential-min-pct-change "$MIN_PCT_CHANGE" --potential-min-trading-days "$MIN_TRADING_DAYS")
          if [ -n "$END_DATE" ]; then
            args+=(--trade-date "$END_DATE")
          fi
          python3 scripts/run_recap.py "${args[@]}"

      - name: Upload potential-stock recap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potential-stock-recap-${{ github.run_id }}
          path: |
            artifacts/reports/tushare-recap-reports/**
            artifacts/cache/tushare/**
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/reports
          keep_files: true
