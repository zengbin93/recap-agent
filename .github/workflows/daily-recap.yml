name: Daily Global Market Recap

on:
  schedule:
    # UTC 11:00 = 19:00 Asia/Shanghai, running only on Monday to Friday (trading days).
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: "Recap task to run"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly
          - potential
      dry_run:
        description: "Generate artifacts without sending Feishu card"
        required: true
        default: true
        type: boolean

permissions:
  contents: write  # 需要写权限来发布 gh-pages
  id-token: write  # claude-code-action 需要 OIDC token

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_URL: ${{ secrets.TUSHARE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_WEBHOOKS_JSON: ${{ secrets.FEISHU_WEBHOOKS_JSON }}
      FEISHU_DAILY_WEBHOOK_URL: ${{ secrets.FEISHU_DAILY_WEBHOOK_URL }}
      FEISHU_DAILY_WEBHOOK_SECRET: ${{ secrets.FEISHU_DAILY_WEBHOOK_SECRET }}
      FEISHU_WEEKLY_WEBHOOK_URL: ${{ secrets.FEISHU_WEEKLY_WEBHOOK_URL }}
      FEISHU_WEEKLY_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEEKLY_WEBHOOK_SECRET }}
      FEISHU_MONTHLY_WEBHOOK_URL: ${{ secrets.FEISHU_MONTHLY_WEBHOOK_URL }}
      FEISHU_MONTHLY_WEBHOOK_SECRET: ${{ secrets.FEISHU_MONTHLY_WEBHOOK_SECRET }}
      FEISHU_POTENTIAL_WEBHOOK_URL: ${{ secrets.FEISHU_POTENTIAL_WEBHOOK_URL }}
      FEISHU_POTENTIAL_WEBHOOK_SECRET: ${{ secrets.FEISHU_POTENTIAL_WEBHOOK_SECRET }}
      RECAP_TASK: ${{ github.event.inputs.task || 'daily' }}
      RECAP_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      RECAP_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local package
        run: python -m pip install -e .

      - name: Preflight secrets
        run: |
          missing=0
          required_names=(TUSHARE_TOKEN)
          if [ "$RECAP_TASK" != "potential" ]; then
            required_names+=(ANTHROPIC_API_KEY)
          fi
          for name in "${required_names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret $name"
              missing=1
            fi
          done
          if [ -z "$FEISHU_WEBHOOK_URL" ] && [ -z "$FEISHU_WEBHOOKS_JSON" ] && [ -z "$FEISHU_DAILY_WEBHOOK_URL" ]; then
            echo "::warning::No Feishu webhook secret configured; report generation can run but card push will be skipped."
          fi
          exit "$missing"

      - name: Active sectors recap (Claude-driven)
        if: env.RECAP_TASK == 'daily'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the recap-active-sectors skill to build today's active-sectors recap (data calculations).
            Run this command (dry-run flag comes from RECAP_DRY_RUN):
            python3 skills/recap-active-sectors/scripts/run.py --output-dir artifacts/reports/recap-active-sectors --throttle 0.1
            Leave the generated HTML/CSV/JSON and card under artifacts/reports/recap-active-sectors.
          claude_args: |
            --allowedTools Bash

      - name: Claude Code recap orchestration
        if: env.RECAP_TASK != 'potential'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the repository recap skills to run the selected market recap task.
            Execute the deterministic script exactly once:
            python3 scripts/run_recap.py --task "$RECAP_TASK" --output-dir artifacts/reports $([ "$RECAP_DRY_RUN" = "true" ] && echo "--dry-run")
            Leave generated HTML reports and Feishu card JSON under artifacts/reports.
          claude_args: |
            --allowedTools Bash

      - name: Potential stock recap chain
        if: env.RECAP_TASK == 'potential'
        run: python3 scripts/run_recap.py --task potential --output-dir artifacts/reports

      - name: Upload recap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-${{ env.RECAP_TASK }}-${{ github.run_id }}
          path: |
            artifacts/reports/**
            artifacts/cache/**
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        if: always() && env.RECAP_DRY_RUN != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/reports
          keep_files: true
