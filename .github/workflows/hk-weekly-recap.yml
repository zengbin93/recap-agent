name: Hong Kong Weekly Market Recap

on:
  schedule:
    # Friday 18:30 Asia/Shanghai, after the Hong Kong cash-market close.
    - cron: "30 10 * * 5"
  workflow_dispatch:
    inputs:
      end_date:
        description: "Optional YYYYMMDD; uses the latest Hong Kong trading day when blank"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Generate artifacts and render the card without posting it"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: hk-weekly-recap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_URL: ${{ secrets.TUSHARE_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_WEBHOOKS_JSON: ${{ secrets.FEISHU_WEBHOOKS_JSON }}
      FEISHU_WEEKLY_WEBHOOK_URL: ${{ secrets.FEISHU_WEEKLY_WEBHOOK_URL }}
      FEISHU_WEEKLY_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEEKLY_WEBHOOK_SECRET }}
      FEISHU_HK_WEEKLY_WEBHOOK_URL: ${{ secrets.FEISHU_HK_WEEKLY_WEBHOOK_URL }}
      FEISHU_HK_WEEKLY_WEBHOOK_SECRET: ${{ secrets.FEISHU_HK_WEEKLY_WEBHOOK_SECRET }}
      RECAP_END_DATE: ${{ inputs.end_date }}
      RECAP_DRY_RUN: ${{ inputs.dry_run || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local package
        run: python -m pip install -e .

      - name: Preflight
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "::error::Missing required secret TUSHARE_TOKEN"
            exit 1
          fi
          if [ -z "$FEISHU_HK_WEEKLY_WEBHOOK_URL" ] && [ -z "$FEISHU_WEEKLY_WEBHOOK_URL" ] && [ -z "$FEISHU_WEBHOOK_URL" ] && [ -z "$FEISHU_WEBHOOKS_JSON" ]; then
            echo "::warning::No Feishu webhook configured; the report will be generated but not posted."
          fi

      - name: Generate Hong Kong weekly recap
        run: |
          args=(--output-dir artifacts/reports/hk-weekly-recap --cache-dir artifacts/cache/hk-weekly-recap)
          if [ -n "$RECAP_END_DATE" ]; then args+=(--end-date "$RECAP_END_DATE"); fi
          if [ "$RECAP_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 skills/recap-hk-weekly/scripts/run.py "${args[@]}"

      - name: Upload Hong Kong recap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hk-weekly-recap-${{ github.run_id }}
          path: |
            artifacts/reports/hk-weekly-recap/**
            artifacts/cache/hk-weekly-recap/**
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        if: always() && env.RECAP_DRY_RUN != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/reports
          keep_files: true
