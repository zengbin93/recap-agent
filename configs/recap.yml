# 复盘工程配置（供 Claude Code 编排时参考；运行参数以各 skill 脚本为准）

timezone: Asia/Shanghai

# 各任务默认采集的 tushare 数据集（API 名）
datasets:
  daily: [daily, adj_factor]
  weekly: [daily]
  monthly: [daily]

# 调度规则（由 recap_agent.schedule 解释；cron 在 UTC 00:00 = 北京 08:00 触发）
schedule:
  daily: every_day
  weekly: monday        # 每周一
  monthly: first_3_days # 每月 1–3 号

# 飞书卡片头部颜色（模板）
card_template:
  daily: green
  weekly: blue
  monthly: purple
